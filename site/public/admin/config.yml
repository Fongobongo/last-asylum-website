site_url: https://lastasylum.netlify.app
logo_url: https://lastasylum.netlify.app/og-cover.png
locale: en

# Editorial workflow: editors publish through pull requests; admins merge.
# Requires "Allow editors to publish through PRs" mindset; on public repos
# GitHub permissions do the rest (write access = editor).
publish_mode: editorial_workflow
media_folder: site/static/uploads
public_folder: /uploads

# Auth: GitHub backend with OAuth. Set up an OAuth app (see README-ADMIN.md):
# base_url must point to your OAuth proxy (e.g. sveltia-cms-auth on Vercel/Cloudflare)
backend:
  name: github
  repo: Fongobongo/last-asylum-website
  branch: main

collections:
  # ---------- Guides (English) ----------
  - name: guides_en
    label: "Guides (EN)"
    label_singular: "Guide (EN)"
    folder: site/content/guides/en
    path: "{{slug}}"
    create: true
    slug: "{{title}}"
    extension: md
    sortable_fields: [title, updated, name]
    view_filters:
      - label: "Updated this week"
        field: updated
        pattern: "2026-09-*"
    editor:
      preview: true
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: string, required: false }
      - { label: "Language", name: lang, widget: hidden, default: en }
      - { label: "Type", name: type, widget: hidden, default: guide }
      - label: "Video topic"
        name: videoTopic
        widget: select
        required: false
        options:
          - beginner
          - buildings
          - heroes
          - economy
          - raven
          - era
          - gear
          - alliance_duel
          - elixir
          - kvk
          - undead
          - cheese
          - crystal
          - thief
          - survival
          - canyon
          - mythic
          - royal
          - arena
          - wagon
      - label: "Interactive calculators"
        name: calculators
        widget: list
        required: false
        field: { label: "Calculator", name: calc, widget: select, options: ["ad-phase4", "claire-shards", "cynthia-wheel"] }
      - label: "Infographics (webp paths)"
        name: infographics
        widget: list
        required: false
        field: { label: "Image", name: src, widget: string }
      - { label: "Updated (YYYY-MM-DD)", name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Hide from search engines", name: noindex, widget: boolean, default: false, required: false }
      - { label: "Body", name: body, widget: markdown, modes: [rich_text, raw] }

  # ---------- Guides (Russian) ----------
