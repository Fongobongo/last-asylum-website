[build]
  command = "npm run build"
  publish = "dist"
  base = "site"

[build.environment]
  NODE_VERSION = "22"

# Site moved to Cloudflare Pages — Netlify only redirects everything there.
# (In-site redirects like /atlas/ -> /guides/ now live in site/public/_redirects
# for Cloudflare; Netlify just forwards the whole host.)
[[redirects]]
  from = "/*"
  to = "https://lastasylum.pages.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
