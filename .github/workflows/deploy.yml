name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (with pagefind index)
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Check internal links
        run: npm run check:links

      - name: Verify search index exists
        run: |
          test -f dist/pagefind/pagefind.js || {
            echo "::error::pagefind index missing — refusing to deploy"; exit 1;
          }

      - name: Deploy to Cloudflare Pages
        # CI runners have 7 GB RAM; the local box OOM-kills pagefind at ~2.7 GB.
        # Prod must always deploy from this full, verified build.
        # IMPORTANT: wrangler resolves the Pages Functions directory as
        # path.join(cwd, "functions") — run from the REPO ROOT, not site/,
        # or the /api/* endpoints silently vanish from prod.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: site/node_modules/.bin/wrangler pages deploy site/dist --project-name=lastasylum --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
