name: Auto-update data & deploy

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install "git+https://github.com/dolfies/discord.py-self.git" python-dotenv

      - name: Scrape Discord channels
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python parse_channel.py
        continue-on-error: true # tolerate transient Discord rate-limits

      - name: Regenerate site data
        run: python update_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        run: npm ci && npm run build
        working-directory: site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Commit & push updated data (if changed)
        run: |
          git config user.name "auto-update-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/src/data/patchnotes.ts data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update patch notes [skip ci]"
            git push
          fi
      - name: Deploy updated site to Cloudflare Pages
        # From the repo root: wrangler picks up ./functions (Pages Functions)
        # via path.join(cwd, "functions") — running from site/ would strip
        # the /api/* endpoints from prod.
        run: |
          test -f site/dist/pagefind/pagefind.js || { echo "pagefind index missing — refusing to deploy"; exit 1; }
          site/node_modules/.bin/wrangler pages deploy site/dist --project-name=lastasylum --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
